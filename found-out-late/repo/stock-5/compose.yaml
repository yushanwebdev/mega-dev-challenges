services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports: ["5463:5432"]
    environment:
      POSTGRES_USER: stock5
      POSTGRES_PASSWORD: stock5
      POSTGRES_DB: reorder_27wf
    volumes:
      - stock5-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock5 -d reorder_27wf"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  stock5-pgdata:
